<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="pm-public" content="1">
<title>Fra fullmektig til megler</title>
<style>
@font-face{font-family:'DomaineDisplay';src:url('media/fonts/domainedisplay.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'DomaineText';src:url('media/fonts/domainetext.otf') format('opentype');font-weight:300;font-display:swap}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-style:normal}
:root{
  --dark:#262830;--dark-2:#2a2c35;--mid:#363844;--mid-2:#3e4050;
  --muted:#7a7c88;--light:#E5E4E3;--light-2:#d8d7d6;
  --glass:rgba(38,40,48,0.55);--glass-2:rgba(50,52,62,0.45);
  --serif:'DomaineDisplay',Georgia,serif;--sans:'DomaineText',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--light);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.7;overflow-x:hidden}

/* ── ACCESS GATE ── */
#access-gate{display:none;position:fixed;inset:0;z-index:9999;background:var(--dark);align-items:center;justify-content:center;flex-direction:column}
.gate-inner{text-align:center;padding:40px 32px;max-width:380px;width:100%}
.gate-logo{height:40px;width:auto;opacity:0.5;margin-bottom:48px}
.gate-title{font-family:var(--serif);font-size:28px;font-weight:300;color:var(--light);margin-bottom:8px}
.gate-sub{font-size:13px;color:var(--muted);margin-bottom:32px;letter-spacing:0.03em}
#gate-input{width:100%;padding:14px 18px;background:rgba(229,228,227,0.04);border:1px solid rgba(229,228,227,0.1);border-radius:8px;color:var(--light);font-family:var(--sans);font-size:14px;outline:none;text-align:center;letter-spacing:0.08em;transition:border-color 0.2s}
#gate-input:focus{border-color:rgba(229,228,227,0.25)}
#gate-input.error{border-color:rgba(229,80,80,0.5)}
#gate-btn{display:block;width:100%;margin-top:16px;padding:14px;background:var(--light);color:var(--dark);border:none;font-family:var(--sans);font-size:10px;letter-spacing:0.3em;text-transform:uppercase;cursor:pointer;transition:background 0.2s}
#gate-btn:hover{background:var(--light-2)}
#gate-error{display:none;margin-top:16px;font-size:12px;color:rgba(229,80,80,0.7);letter-spacing:0.04em}

/* ── PROGRESS ── */
#progress{position:fixed;top:0;left:0;height:1px;background:var(--light);z-index:999;width:0;opacity:0.3}

/* ── STICKY NAV ── */
#sticky-nav{position:fixed;top:0;left:0;right:0;z-index:300;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(26,28,36,0.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(229,228,227,0.07);transform:translateY(-100%);transition:transform 0.38s cubic-bezier(0.22,1,0.36,1)}
#sticky-nav.visible{transform:translateY(0)}
.snav-logo img{height:44px;width:auto;display:block;opacity:0.95}
.snav-burger{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;width:28px;height:20px;padding:0}
.snav-burger span{display:block;height:1px;background:var(--light);transition:opacity 0.2s,transform 0.25s;transform-origin:center}
.snav-burger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.snav-burger.open span:nth-child(2){opacity:0}
.snav-burger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
#snav-dropdown{position:fixed;top:56px;right:0;z-index:299;width:280px;background:rgba(26,28,36,0.98);backdrop-filter:blur(24px);border-left:1px solid rgba(229,228,227,0.07);border-bottom:1px solid rgba(229,228,227,0.07);transform:translateX(100%);transition:transform 0.36s cubic-bezier(0.22,1,0.36,1)}
#snav-dropdown.open{transform:translateX(0)}
.sdrop-item{display:flex;align-items:center;gap:18px;padding:20px 28px;border-bottom:1px solid rgba(229,228,227,0.06);cursor:pointer;text-decoration:none;transition:background 0.2s}
.sdrop-item:last-child{border-bottom:none}
.sdrop-item:hover{background:rgba(229,228,227,0.04)}
.sdrop-item.active{background:rgba(229,228,227,0.06)}
.sdrop-num{display:none}
.sdrop-label{font-size:14px;color:var(--light);font-weight:300}
.sdrop-sub{font-size:10px;color:var(--muted);margin-top:2px}

/* ── HERO ── */
.hero{position:relative;width:100%;height:90vh;min-height:560px;overflow:hidden}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(28,30,36,0) 0%,rgba(28,30,36,0) 52%,rgba(28,30,36,1) 100%)}
.hero-content{position:absolute;bottom:112px;left:0;right:0;text-align:center;z-index:10;padding:0 24px}
.hero-eyebrow{font-size:9px;letter-spacing:0.45em;text-transform:uppercase;color:rgba(229,228,227,0.45);margin-bottom:18px}
.hero-title{font-family:var(--serif);font-size:clamp(52px,9vw,112px);font-weight:300;line-height:0.92;letter-spacing:-0.025em;color:var(--light)}
.hero-title-line2{display:block}
.hero-nav{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:0;height:62px;background:rgba(20,22,28,0.88);backdrop-filter:blur(22px);border-top:1px solid rgba(229,228,227,0.04)}
.hero-nav a.hn-btn{font-size:15px;font-weight:500;letter-spacing:0.04em;color:var(--light);text-decoration:none;transition:opacity 0.25s;position:relative;display:flex;align-items:center;gap:10px;padding:0 28px;height:100%;cursor:pointer}
.hero-nav a.hn-btn:hover{opacity:0.7}
.hero-nav a.hn-btn svg{width:22px;height:22px;flex-shrink:0}
.ep-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(20,22,28,0.92);backdrop-filter:blur(30px);flex-direction:column;align-items:center;justify-content:center;gap:0}
.ep-overlay.open{display:flex}
.ep-overlay-close{position:absolute;top:28px;right:32px;background:none;border:none;color:var(--light);font-size:28px;cursor:pointer;opacity:0.5;transition:opacity 0.2s}
.ep-overlay-close:hover{opacity:1}
.ep-overlay a{display:block;padding:18px 0;font-size:15px;letter-spacing:0.18em;color:rgba(229,228,227,0.4);text-decoration:none;transition:color 0.2s;text-align:center;min-width:280px;border-bottom:1px solid rgba(229,228,227,0.05)}
.ep-overlay a:hover,.ep-overlay a.active{color:var(--light)}
.ep-overlay a:last-child{border-bottom:none}

/* ── FEED ── */
.feed{max-width:660px;margin:0 auto;padding:0 24px 80px}
.post{position:relative;padding:32px 0;border-bottom:1px solid rgba(229,228,227,0.05);text-align:center;opacity:0;transform:translateY(22px);transition:opacity 0.7s ease,transform 0.7s ease}
.post.visible{opacity:1;transform:translateY(0)}
.post:last-child{border-bottom:none}
.post-stamp{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.stamp-date{font-size:13px;letter-spacing:0.06em;color:rgba(229,228,227,0.45);font-weight:300}
.ep-number{font-size:9px;letter-spacing:0.4em;text-transform:uppercase;color:rgba(229,228,227,0.3);margin-bottom:8px}
.ep-title{font-family:var(--serif);font-size:clamp(32px,5vw,52px);font-weight:300;line-height:1.08;letter-spacing:-0.015em;color:var(--light);margin-bottom:28px;white-space:pre-line}
.text-body{font-size:15px;line-height:1.85;color:rgba(229,228,227,0.55);text-align:left;max-width:500px;margin:0 auto}
.text-body p+p{margin-top:16px}

/* ── DROP ZONE (viewer) ── */
.drop-zone-wrap{display:flex;justify-content:center;width:100%}
.drop-zone-wrap.bleed{width:calc(100% + 48px);margin:0 -24px}
.drop-zone{position:relative;background:var(--dark-2);border:1px dashed rgba(229,228,227,0.09);display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box}
.drop-zone.wide{width:100%;height:360px;min-height:80px}
.drop-zone.tall{width:320px;height:400px;min-height:80px}
.drop-zone.sq{width:420px;height:420px;min-height:80px}
.drop-zone.has-media{border-style:solid;border-color:transparent;background:transparent}
.drop-zone .media-content{position:absolute;width:100%;height:100%;object-fit:contain;display:block}
.drop-zone video.media-content{background:#000}
.video-play-overlay{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,0.25);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity 0.3s,background 0.3s}
.video-play-overlay:hover{background:rgba(0,0,0,0.35)}
.video-play-overlay.playing{opacity:0;pointer-events:none}
.video-play-overlay svg{filter:drop-shadow(0 2px 8px rgba(0,0,0,0.4));opacity:0.9;transition:transform 0.2s}
.video-play-overlay:hover svg{transform:scale(1.1)}
.img-caption{margin-top:10px;font-size:10px;color:var(--muted);opacity:0.45;letter-spacing:0.04em}

/* ── SMS / CHAT ── */
.phone-frame{background:var(--dark-2);border-radius:14px;padding:20px 18px 18px;border:1px solid rgba(229,228,227,0.07);text-align:left}
.phone-top{display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(229,228,227,0.05)}
.online-dot{width:6px;height:6px;border-radius:50%;background:#4cd964}
.contact-name{font-size:13px;font-weight:400;color:var(--light)}
.messages{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;flex-direction:column;max-width:82%;position:relative}
.msg.them{align-self:flex-start;align-items:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg-sender{font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;padding:0 10px}
.bubble{padding:10px 15px;border-radius:17px;font-size:14px;line-height:1.5;font-weight:300;min-height:20px;min-width:60px}
.msg.them .bubble{background:var(--mid-2);color:var(--light);border-bottom-left-radius:4px}
.msg.me .bubble{background:#2d5a8e;color:#fff;border-bottom-right-radius:4px}
.msg-time{font-size:8px;color:var(--muted);margin-top:3px;padding:0 10px;opacity:0.35}

/* ── QUIZ CARD ── */
.quiz-card{background:var(--dark-2);border:1px solid rgba(229,228,227,0.09);border-radius:14px;overflow:hidden;text-align:left}
.qc-top{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 0}
.qc-badge{font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted)}
.qc-counter{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.qc-dots{display:flex;gap:5px;padding:14px 24px 0}
.qc-seg{height:2px;flex:1;border-radius:2px;background:rgba(229,228,227,0.1);transition:background 0.35s}
.qc-seg.done{background:rgba(229,228,227,0.4)}
.qc-seg.active{background:var(--light)}
.qc-viewport{overflow:hidden}
.qc-slides{display:flex;transition:transform 0.38s cubic-bezier(0.4,0,0.2,1);will-change:transform}
.qc-slide{min-width:100%;padding:26px 24px 20px}
.qc-q-num{font-size:8px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.qc-question{font-family:var(--serif);font-size:22px;font-weight:300;color:var(--light);margin-bottom:20px;line-height:1.3}
.qc-options{display:flex;flex-direction:column;gap:8px}
.qc-option{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:8px;border:1px solid rgba(229,228,227,0.09);background:rgba(229,228,227,0.03);cursor:pointer;transition:all 0.18s}
.qc-option:hover{border-color:rgba(229,228,227,0.2);background:rgba(229,228,227,0.06)}
.qc-option.correct{border-color:rgba(76,217,100,0.45);background:rgba(76,217,100,0.07);pointer-events:none}
.qc-option.wrong{border-color:rgba(229,228,227,0.04);opacity:0.3;pointer-events:none}
.qc-option.picked{border-color:rgba(229,228,227,0.28);background:rgba(229,228,227,0.06);pointer-events:none}
.qc-radio{width:16px;height:16px;border-radius:50%;border:1px solid rgba(229,228,227,0.2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.qc-option.correct .qc-radio,.qc-option.picked .qc-radio{border-color:var(--light);background:var(--light)}
.qc-inner-dot{width:6px;height:6px;border-radius:50%;background:var(--dark);opacity:0}
.qc-option.correct .qc-inner-dot,.qc-option.picked .qc-inner-dot{opacity:1}
.qc-option-text{font-size:13px;color:rgba(229,228,227,0.78);line-height:1.4;flex:1}
.qc-reveal{margin-top:16px;padding:13px 16px;border-radius:8px;background:rgba(229,228,227,0.04);border-left:2px solid rgba(229,228,227,0.14);font-size:13px;color:rgba(229,228,227,0.6);line-height:1.6;display:none}
.qc-reveal.show{display:block;animation:qFade 0.3s ease}
.qc-reveal strong{color:var(--light);font-weight:400}
@keyframes qFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.qc-result{padding:40px 24px 36px;text-align:center}
.qc-score-big{font-family:var(--serif);font-size:88px;font-weight:300;line-height:1;color:var(--light);margin-bottom:4px}
.qc-score-label{font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:32px}
.qc-fasit{text-align:left;border-top:1px solid rgba(229,228,227,0.07);padding-top:24px}
.qc-fasit-title{font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.qc-fasit-row{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid rgba(229,228,227,0.05)}
.qc-fasit-row:last-child{border-bottom:none}
.qc-fasit-q{font-size:12px;color:var(--muted);flex:1}
.qc-fasit-a{font-size:12px;color:var(--light);flex:2}

/* ── PULL QUOTE ── */
.quote-block{padding:60px 0;text-align:center;border-top:1px solid rgba(229,228,227,0.05);border-bottom:1px solid rgba(229,228,227,0.05);margin:0 -24px}
.quote-block blockquote{font-family:var(--serif);font-size:clamp(22px,3.2vw,40px);font-weight:300;line-height:1.3;color:var(--light);max-width:500px;margin:0 auto;padding:0 40px}
.quote-block cite{display:block;margin-top:20px;font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted)}

/* ── CHAPTER BREAK ── */
.chapter-break{display:flex;align-items:center;gap:20px;padding:40px 0 0}
.break-line{flex:1;height:1px;background:rgba(229,228,227,0.07)}
.break-label{font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(229,228,227,0.3);white-space:nowrap}

/* ── CTA ── */
.cta-section{text-align:center;padding:80px 24px 100px;border-top:1px solid rgba(229,228,227,0.06)}
.cta-label{font-size:9px;letter-spacing:0.4em;text-transform:uppercase;color:rgba(229,228,227,0.35);margin-bottom:24px}
.cta-title{font-family:var(--serif);font-size:clamp(40px,6vw,76px);font-weight:300;line-height:1.05;color:var(--light);margin-bottom:44px}
.cta-btns{display:flex;flex-direction:column;align-items:center;gap:12px}
.btn{display:inline-block;padding:15px 46px;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;text-decoration:none;transition:all 0.3s;font-family:var(--sans)}
.btn-fill{background:var(--light);color:var(--dark)}
.btn-fill:hover{background:var(--light-2)}
.btn-outline{border:1px solid rgba(229,228,227,0.18);color:var(--muted)}
.btn-outline:hover{border-color:var(--light);color:var(--light)}

/* ── PAGINATION ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:4px;padding:48px 24px 80px}
.page-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;transition:color 0.2s,background 0.2s;text-decoration:none;font-family:var(--sans);font-weight:300;border-radius:4px}
.page-btn:hover{color:var(--light);background:rgba(229,228,227,0.05)}
.page-btn.active{background:var(--light);color:var(--dark);font-weight:400}
.page-btn.arrow{font-size:16px;opacity:0.55}
.page-btn.arrow:hover{opacity:1;background:rgba(229,228,227,0.05)}
.page-btn.disabled{opacity:0.15;pointer-events:none}
.page-sep{font-size:11px;color:var(--muted);opacity:0.3;padding:0 6px}

/* ── FOOTER ── */
footer{border-top:1px solid rgba(229,228,227,0.05);display:flex;align-items:center;justify-content:space-between;padding:28px 40px;flex-wrap:wrap;gap:12px}
footer img{height:26px;width:auto;opacity:0.45}
footer p{font-size:9px;letter-spacing:0.12em;color:var(--muted);opacity:0.4}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .hero-nav a.hn-btn{padding:0 12px;font-size:12px;gap:6px}
  .hero-nav a.hn-btn svg{width:16px;height:16px}
  .feed{padding:0 16px 60px}
  .quote-block{margin:0 -16px}
  footer{padding:24px}
  .drop-zone.tall{width:260px;height:340px}
  .drop-zone.sq{width:300px;height:300px}
  .drop-zone-wrap.bleed{width:calc(100% + 32px);margin:0 -16px}
  .gate-inner{padding:32px 24px}
}
</style>
</head>
<body>

<!-- ════════ ACCESS GATE ════════ -->
<div id="access-gate">
  <div class="gate-inner">
    <img src="media/img/pm-logo.png" alt="PrivatMegleren" class="gate-logo">
    <h2 class="gate-title">Tilgangskode</h2>
    <p class="gate-sub">Skriv inn koden for tilgang</p>
    <input type="text" id="gate-input" placeholder="Kode" autocomplete="off">
    <button id="gate-btn">Gå videre</button>
    <p id="gate-error">Feil kode. Prøv igjen.</p>
  </div>
</div>

<!-- ════════ MAIN CONTENT ════════ -->
<div id="main-content" style="display:none">

  <div id="progress"></div>

  <!-- HERO -->
  <div class="hero" id="hero">
    <img class="hero-img" id="hero-img" src="media/img/felix-hero.jpg" alt="">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-eyebrow" id="hero-eyebrow"></div>
      <h1 class="hero-title" id="hero-title"></h1>
    </div>
    <nav class="hero-nav">
      <a class="hn-btn" id="hn-first">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><polyline points="14,5 8,11 14,17"/></svg>
        Første
      </a>
      <a class="hn-btn" id="hn-last">
        Siste
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><polyline points="8,5 14,11 8,17"/></svg>
      </a>
      <a class="hn-btn" id="hn-episodes">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="4" y="4" width="5" height="5" rx="1"/><rect x="13" y="4" width="5" height="5" rx="1"/><rect x="4" y="13" width="5" height="5" rx="1"/><rect x="13" y="13" width="5" height="5" rx="1"/></svg>
        Episoder
      </a>
      <a class="hn-btn" id="hn-menu">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="4" y1="7" x2="18" y2="7"/><line x1="4" y1="11" x2="18" y2="11"/><line x1="4" y1="15" x2="18" y2="15"/></svg>
        Meny
      </a>
    </nav>
  </div>

  <!-- STICKY NAV -->
  <nav id="sticky-nav">
    <a class="snav-logo" href="#hero"><img src="media/img/pm-logo.png" alt="PrivatMegleren"></a>
    <button class="snav-burger" id="snav-burger">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- STICKY NAV DROPDOWN -->
  <div id="snav-dropdown"></div>

  <!-- EPISODE OVERLAY -->
  <div class="ep-overlay" id="ep-overlay">
    <button class="ep-overlay-close" id="ep-overlay-close">&times;</button>
    <div id="ep-overlay-list"></div>
  </div>

  <!-- FEED CONTAINER (pages rendered by JS) -->
  <div id="feed-container"></div>

  <!-- PAGINATION -->
  <div class="pagination" id="pagination"></div>

  <!-- FOOTER -->
  <footer>
    <img src="media/img/pm-logo.png" alt="PrivatMegleren">
    <p>PrivatMegleren</p>
  </footer>

</div>

<script>
(function(){
  'use strict';

  var LS_KEY = 'pm-viewer-v1';
  var data = null;
  var currentPage = 0;
  var totalPages = 0;
  var quizStates = {};
  var quizCounter = 0;
  var observer = null;

  /* ── INIT ── */
  document.addEventListener('DOMContentLoaded', function(){
    fetch('./content/published.json?v=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(json){
        data = json;
        var saved = localStorage.getItem(LS_KEY);
        if(saved === data.accessCode){
          grantAccess();
        } else {
          document.getElementById('access-gate').style.display = 'flex';
        }
      })
      .catch(function(err){
        console.error('Kunne ikke laste innhold:', err);
      });
  });

  /* ── ACCESS GATE ── */
  document.getElementById('gate-btn').addEventListener('click', checkAccess);
  document.getElementById('gate-input').addEventListener('keydown', function(e){
    if(e.key === 'Enter') checkAccess();
  });

  function checkAccess(){
    if(!data) return;
    var code = document.getElementById('gate-input').value.trim();
    if(code === data.accessCode){
      localStorage.setItem(LS_KEY, code);
      grantAccess();
    } else {
      document.getElementById('gate-error').style.display = 'block';
      document.getElementById('gate-input').classList.add('error');
    }
  }

  function grantAccess(){
    document.getElementById('access-gate').style.display = 'none';
    document.getElementById('main-content').style.display = '';
    render();
  }

  /* ── RENDER ── */
  function render(){
    document.title = data.title;

    /* Hero */
    document.getElementById('hero-eyebrow').textContent = data.subtitle || '';
    var titleEl = document.getElementById('hero-title');
    var titleParts = data.title.split(/\s+(?=til\b)/i);
    if(titleParts.length >= 2){
      titleEl.innerHTML = esc(titleParts[0]) + '<span class="hero-title-line2">' + esc(titleParts.slice(1).join(' ')) + '</span>';
    } else {
      titleEl.textContent = data.title;
    }
    if(data.heroImage){
      document.getElementById('hero-img').src = data.heroImage;
    }

    /* Episodes */
    totalPages = data.episodes.length;
    var container = document.getElementById('feed-container');

    data.episodes.forEach(function(ep, i){
      var page = document.createElement('div');
      page.className = 'page-content feed';
      page.id = 'page-' + i;
      if(i !== 0) page.style.display = 'none';

      ep.posts.forEach(function(post){
        var el = renderPost(post, ep);
        if(el) page.appendChild(el);
      });

      container.appendChild(page);
    });

    buildPagination();
    buildEpOverlay();
    buildSnavDropdown();
    setupStickyNav();
    setupObserver();
    setupHeroNav();
    setupProgress();
    goToPage(0);
  }

  /* ── ESCAPE HTML ── */
  function esc(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  /* ── RENDER POST ── */
  function renderPost(post, episode){
    switch(post.type){
      case 'text':   return renderText(post, episode);
      case 'chat':   return renderChat(post);
      case 'media':  return renderMedia(post);
      case 'quiz':   return renderQuiz(post);
      case 'quote':  return renderQuote(post);
      case 'cta':    return renderCta(post);
      default:       return null;
    }
  }

  /* ── TEXT ── */
  function renderText(post, ep){
    var div = document.createElement('div');
    div.className = 'post';

    var paragraphs = post.text.split(/\n\n+/).map(function(p){
      return '<p>' + esc(p.trim()).replace(/\n/g,'<br>') + '</p>';
    }).join('');

    div.innerHTML =
      '<div class="ep-number">' + esc(ep.episodeNumber) + '</div>' +
      '<h2 class="ep-title">' + esc(ep.episodeTitle).replace(/\n/g,'<br>') + '</h2>' +
      '<div class="text-body">' + paragraphs + '</div>';
    return div;
  }

  /* ── CHAT ── */
  function renderChat(post){
    var div = document.createElement('div');
    div.className = 'post';

    var msgs = post.messages.map(function(m){
      return '<div class="msg ' + esc(m.direction) + '">' +
        '<div class="msg-sender">' + esc(m.sender) + '</div>' +
        '<div class="bubble">' + esc(m.text) + '</div>' +
        '<div class="msg-time">' + esc(m.time) + '</div>' +
      '</div>';
    }).join('');

    div.innerHTML =
      '<div class="phone-frame">' +
        '<div class="phone-top">' +
          '<div class="online-dot"></div>' +
          '<div class="contact-name">' + esc(post.contactName) + '</div>' +
        '</div>' +
        '<div class="messages">' + msgs + '</div>' +
      '</div>';
    return div;
  }

  /* ── MEDIA ── */
  function renderMedia(post){
    var div = document.createElement('div');
    div.className = 'post';

    var bleed = post.layout === 'bleed' ? ' bleed' : '';
    var aspect = post.aspect || 'wide';
    var content = '';

    if(post.src){
      var ext = post.src.split('.').pop().toLowerCase();
      if(ext === 'mp4' || ext === 'webm' || ext === 'mov'){
        content =
          '<video class="media-content" src="' + esc(post.src) + '" preload="metadata" playsinline></video>' +
          '<button class="video-play-overlay" aria-label="Spill av">' +
            '<svg width="48" height="48" viewBox="0 0 48 48"><polygon points="18,12 38,24 18,36" fill="white"/></svg>' +
          '</button>';
      } else {
        content = '<img class="media-content" src="' + esc(post.src) + '" alt="" loading="lazy">';
      }
      div.innerHTML =
        '<div class="drop-zone-wrap' + bleed + '">' +
          '<div class="drop-zone ' + aspect + ' has-media">' + content + '</div>' +
        '</div>';
    } else {
      div.innerHTML =
        '<div class="drop-zone-wrap' + bleed + '">' +
          '<div class="drop-zone ' + aspect + '"></div>' +
        '</div>';
    }

    /* video play button */
    var playBtn = div.querySelector('.video-play-overlay');
    if(playBtn){
      playBtn.addEventListener('click', function(){
        var video = div.querySelector('video');
        if(!video) return;
        if(video.paused){
          video.play();
          playBtn.classList.add('playing');
        } else {
          video.pause();
          playBtn.classList.remove('playing');
        }
      });
    }

    return div;
  }

  /* ── QUIZ ── */
  function renderQuiz(post){
    var div = document.createElement('div');
    div.className = 'post';

    var qid = 'quiz-' + quizCounter++;
    var total = post.questions.length;
    quizStates[qid] = { current:0, score:0, total:total, answered:{}, questions:post.questions, feedback:post.feedback };

    /* Dots */
    var dots = post.questions.map(function(_,i){
      return '<div class="qc-seg' + (i===0?' active':'') + '"></div>';
    }).join('');

    /* Question slides */
    var slides = post.questions.map(function(q,i){
      var opts = q.options.map(function(opt,oi){
        return '<div class="qc-option" data-correct="' + (opt.correct?'true':'false') + '" data-qid="' + qid + '" data-qi="' + i + '" data-oi="' + oi + '">' +
          '<div class="qc-radio"><div class="qc-inner-dot"></div></div>' +
          '<span class="qc-option-text">' + esc(opt.text) + '</span>' +
        '</div>';
      }).join('');

      return '<div class="qc-slide">' +
        '<div class="qc-q-num">spørsmål ' + (i+1) + '</div>' +
        '<div class="qc-question">' + esc(q.question) + '</div>' +
        '<div class="qc-options">' + opts + '</div>' +
      '</div>';
    }).join('');

    /* Result slide */
    slides += '<div class="qc-slide"><div class="qc-result">' +
      '<div class="qc-score-big" id="' + qid + '-score">0</div>' +
      '<div class="qc-score-label">av ' + total + ' riktige</div>' +
      (post.feedback ? '<div class="qc-fasit"><div class="qc-fasit-title">Tilbakemelding</div><p style="font-size:13px;color:rgba(229,228,227,0.6);line-height:1.6">' + esc(post.feedback) + '</p></div>' : '') +
    '</div></div>';

    div.innerHTML =
      '<div class="quiz-card" id="' + qid + '">' +
        '<div class="qc-top">' +
          '<span class="qc-badge">Quiz</span>' +
          '<span class="qc-counter" id="' + qid + '-counter">1 / ' + total + '</span>' +
        '</div>' +
        '<div class="qc-dots" id="' + qid + '-dots">' + dots + '</div>' +
        '<div class="qc-viewport">' +
          '<div class="qc-slides" id="' + qid + '-slides">' + slides + '</div>' +
        '</div>' +
      '</div>';

    /* Attach option click handlers */
    setTimeout(function(){
      var card = document.getElementById(qid);
      if(!card) return;
      card.querySelectorAll('.qc-option').forEach(function(opt){
        opt.addEventListener('click', function(){ handleQuizOption(opt); });
      });
    }, 0);

    return div;
  }

  function handleQuizOption(el){
    var qid = el.dataset.qid;
    var qi = parseInt(el.dataset.qi,10);
    var state = quizStates[qid];
    if(!state || state.answered[qi]) return;
    state.answered[qi] = true;

    var isCorrect = el.dataset.correct === 'true';
    var slide = el.closest('.qc-slide');
    var options = slide.querySelectorAll('.qc-option');

    if(isCorrect){
      el.classList.add('correct');
      state.score++;
    } else {
      el.classList.add('picked');
      options.forEach(function(opt){
        if(opt.dataset.correct === 'true') opt.classList.add('correct');
        else if(opt !== el) opt.classList.add('wrong');
      });
    }

    /* Dim remaining options */
    options.forEach(function(opt){
      if(!opt.classList.contains('correct') && !opt.classList.contains('picked')){
        opt.classList.add('wrong');
      }
    });

    /* Auto-advance */
    setTimeout(function(){
      var nextIdx = qi + 1;
      if(nextIdx < state.total){
        state.current = nextIdx;
        advanceQuiz(qid, nextIdx);
      } else {
        state.current = state.total;
        advanceQuiz(qid, state.total);
        var scoreEl = document.getElementById(qid + '-score');
        if(scoreEl) scoreEl.textContent = state.score;
      }
    }, 1200);
  }

  function advanceQuiz(qid, index){
    var state = quizStates[qid];
    var slides = document.getElementById(qid + '-slides');
    if(slides) slides.style.transform = 'translateX(-' + (index * 100) + '%)';

    /* Update dots */
    var dotsWrap = document.getElementById(qid + '-dots');
    if(dotsWrap){
      var segs = dotsWrap.children;
      for(var i=0;i<segs.length;i++){
        segs[i].classList.remove('active','done');
        if(i < index) segs[i].classList.add('done');
        else if(i === index) segs[i].classList.add('active');
      }
    }

    /* Update counter */
    var counter = document.getElementById(qid + '-counter');
    if(counter){
      if(index < state.total) counter.textContent = (index+1) + ' / ' + state.total;
      else counter.textContent = 'Resultat';
    }
  }

  /* ── QUOTE ── */
  function renderQuote(post){
    var div = document.createElement('div');
    div.className = 'post quote-block';
    div.innerHTML =
      '<blockquote>' +
        '<span>' + esc(post.text) + '</span>' +
        '<cite>' + esc(post.cite) + '</cite>' +
      '</blockquote>';
    return div;
  }

  /* ── CTA ── */
  function renderCta(post){
    var div = document.createElement('div');
    div.className = 'cta-section';

    var btns = post.buttons.map(function(b){
      var href = b.url || '#';
      return '<a class="btn ' + esc(b.style) + '" href="' + esc(href) + '"' + (href !== '#' ? ' target="_blank" rel="noopener"' : '') + '>' + esc(b.text) + '</a>';
    }).join('');

    div.innerHTML =
      '<div class="cta-label">' + esc(post.label) + '</div>' +
      '<h2 class="cta-title">' + esc(post.title) + '</h2>' +
      '<div class="cta-btns">' + btns + '</div>';
    return div;
  }

  /* ── PAGINATION ── */
  function buildPagination(){
    var wrap = document.getElementById('pagination');
    if(!wrap) return;
    var html = '<button class="page-btn arrow" id="pb-prev" aria-label="Forrige">&larr;</button>';
    for(var i=0;i<totalPages;i++){
      html += '<button class="page-btn' + (i===0?' active':'') + '" data-page="' + i + '">' + (i+1) + '</button>';
    }
    html += '<button class="page-btn arrow" id="pb-next" aria-label="Neste">&rarr;</button>';
    wrap.innerHTML = html;

    /* Attach events */
    document.getElementById('pb-prev').addEventListener('click', function(){ goToPage(currentPage - 1); });
    document.getElementById('pb-next').addEventListener('click', function(){ goToPage(currentPage + 1); });
    wrap.querySelectorAll('.page-btn[data-page]').forEach(function(btn){
      btn.addEventListener('click', function(){ goToPage(parseInt(btn.dataset.page,10)); });
    });
  }

  /* ── EPISODE OVERLAY ── */
  function buildEpOverlay(){
    var list = document.getElementById('ep-overlay-list');
    if(!list) return;
    var html = '';
    data.episodes.forEach(function(ep, i){
      html += '<a data-page="' + i + '"' + (i===0?' class="active"':'') + '>' +
        esc(ep.episodeNumber) + ' — ' + esc(ep.episodeTitle.replace(/\n/g,' ')) +
      '</a>';
    });
    list.innerHTML = html;

    list.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        goToPage(parseInt(a.dataset.page,10));
        closeEpOverlay();
      });
    });

    document.getElementById('ep-overlay-close').addEventListener('click', closeEpOverlay);
  }

  function toggleEpOverlay(){
    document.getElementById('ep-overlay').classList.toggle('open');
  }
  function closeEpOverlay(){
    document.getElementById('ep-overlay').classList.remove('open');
  }

  /* ── SNAV DROPDOWN ── */
  function buildSnavDropdown(){
    var dd = document.getElementById('snav-dropdown');
    if(!dd) return;
    var html = '';
    data.episodes.forEach(function(ep,i){
      html += '<a class="sdrop-item' + (i===0?' active':'') + '" data-page="' + i + '">' +
        '<div><div class="sdrop-label">' + esc(ep.episodeTitle.replace(/\n/g,' ')) + '</div>' +
        '<div class="sdrop-sub">' + esc(ep.chapterLabel) + '</div></div>' +
      '</a>';
    });
    dd.innerHTML = html;

    dd.querySelectorAll('.sdrop-item').forEach(function(item){
      item.addEventListener('click', function(){
        goToPage(parseInt(item.dataset.page,10));
        closeSnavDropdown();
      });
    });
  }

  var snavOpen = false;
  function toggleSnavDropdown(){
    snavOpen = !snavOpen;
    document.getElementById('snav-dropdown').classList.toggle('open', snavOpen);
    document.getElementById('snav-burger').classList.toggle('open', snavOpen);
    /* Make sticky nav visible if not already */
    if(snavOpen) document.getElementById('sticky-nav').classList.add('visible');
  }
  function closeSnavDropdown(){
    snavOpen = false;
    document.getElementById('snav-dropdown').classList.remove('open');
    document.getElementById('snav-burger').classList.remove('open');
  }

  /* ── HERO NAV ── */
  function setupHeroNav(){
    document.getElementById('hn-first').addEventListener('click', function(){ goToPage(0); });
    document.getElementById('hn-last').addEventListener('click', function(){ goToPage(totalPages - 1); });
    document.getElementById('hn-episodes').addEventListener('click', function(){ toggleEpOverlay(); });
    document.getElementById('hn-menu').addEventListener('click', function(){ toggleSnavDropdown(); });
  }

  /* ── STICKY NAV ── */
  function setupStickyNav(){
    var hero = document.getElementById('hero');
    var nav = document.getElementById('sticky-nav');
    var burger = document.getElementById('snav-burger');

    burger.addEventListener('click', toggleSnavDropdown);

    window.addEventListener('scroll', function(){
      if(!hero) return;
      var heroH = hero.offsetHeight;
      if(window.scrollY > heroH - 56){
        nav.classList.add('visible');
      } else {
        if(!snavOpen) nav.classList.remove('visible');
      }
    }, {passive:true});
  }

  /* ── PROGRESS BAR ── */
  function setupProgress(){
    var bar = document.getElementById('progress');
    window.addEventListener('scroll', function(){
      var h = document.documentElement.scrollHeight - window.innerHeight;
      if(h <= 0){ bar.style.width = '0'; return; }
      var pct = Math.min(100, (window.scrollY / h) * 100);
      bar.style.width = pct + '%';
    }, {passive:true});
  }

  /* ── INTERSECTION OBSERVER ── */
  function setupObserver(){
    observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold:0.08, rootMargin:'0px 0px -40px 0px' });
  }

  function observePagePosts(pageIndex){
    var page = document.getElementById('page-' + pageIndex);
    if(!page || !observer) return;
    page.querySelectorAll('.post, .cta-section').forEach(function(post){
      post.classList.remove('visible');
      observer.observe(post);
    });
  }

  /* ── GO TO PAGE ── */
  function goToPage(n){
    if(n < 0 || n >= totalPages) return;

    /* Hide all pages */
    document.querySelectorAll('.page-content').forEach(function(p){ p.style.display = 'none'; });

    /* Show target */
    var target = document.getElementById('page-' + n);
    if(target) target.style.display = 'block';
    currentPage = n;

    /* Update pagination buttons */
    document.querySelectorAll('#pagination .page-btn[data-page]').forEach(function(btn){
      btn.classList.toggle('active', parseInt(btn.dataset.page,10) === n);
    });
    var prev = document.getElementById('pb-prev');
    var next = document.getElementById('pb-next');
    if(prev) prev.classList.toggle('disabled', n === 0);
    if(next) next.classList.toggle('disabled', n === totalPages - 1);

    /* Update dropdown */
    document.querySelectorAll('.sdrop-item').forEach(function(item){
      item.classList.toggle('active', parseInt(item.dataset.page,10) === n);
    });

    /* Update overlay */
    document.querySelectorAll('#ep-overlay-list a').forEach(function(a){
      a.classList.toggle('active', parseInt(a.dataset.page,10) === n);
    });

    /* Scroll to content */
    var hero = document.getElementById('hero');
    var top = hero ? hero.offsetHeight : 0;
    window.scrollTo({ top: top, behavior: 'smooth' });

    /* Observe posts for fade-in */
    setTimeout(function(){ observePagePosts(n); }, 150);
  }

})();
</script>
</body>
</html>
